<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="个人作品集" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23171717'/%3E%3C/svg%3E" />
    <title>作品集</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #e5e5e5;
        color: #171717;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }

      .topbar {
        position: sticky;
        z-index: 1;
        top: 0;
        display: flex;
        min-height: 52px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px max(20px, calc((100vw - 1400px) / 2));
        background: rgb(23 23 23 / 92%);
        color: #fff;
        backdrop-filter: blur(12px);
      }

      h1 { margin: 0; font-size: 1rem; font-weight: 650; }
      #status { font-size: 0.875rem; color: #d4d4d4; }

      .pages {
        width: min(100%, 1440px);
        margin: 0 auto;
        padding: 20px;
      }

      .page {
        position: relative;
        overflow: hidden;
        margin: 0 auto 20px;
        background: #fff;
        box-shadow: 0 3px 16px rgb(0 0 0 / 20%);
      }

      .page canvas {
        display: block;
        width: 100%;
        height: auto;
      }

      .page-placeholder {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f5f5f5;
        color: #737373;
        font-size: 0.875rem;
      }

      .error {
        width: min(calc(100% - 40px), 520px);
        margin: 64px auto;
        padding: 32px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 3px 16px rgb(0 0 0 / 12%);
        text-align: center;
      }

      .error[hidden] { display: none; }
      .error h2 { margin: 0 0 10px; font-size: 1.25rem; }
      .error p { margin: 0; color: #525252; line-height: 1.7; }
      .error a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 15px;
        border-radius: 8px;
        background: #171717;
        color: #fff;
        text-decoration: none;
      }

      @media (max-width: 640px) {
        .topbar { min-height: 48px; padding: 10px 14px; }
        h1 { font-size: 0.9375rem; }
        #status { font-size: 0.8125rem; }
        .pages { padding: 8px 0; }
        .page { margin-bottom: 8px; box-shadow: 0 2px 10px rgb(0 0 0 / 18%); }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>作品集</h1>
      <span id="status" aria-live="polite">正在准备作品集…</span>
    </header>
    <main id="pages" class="pages" aria-busy="true"></main>
    <section id="error" class="error" hidden>
      <h2>作品集暂时无法显示</h2>
      <p>请稍后刷新页面，或直接打开 PDF 文件。</p>
      <a href="./portfolio.pdf" target="_blank" rel="noopener">打开 PDF</a>
    </section>

    <script type="module">
      import * as pdfjsLib from "./vendor/pdfjs/pdf.min.mjs";

      const pdfUrl = "./portfolio.pdf";
      const pages = document.getElementById("pages");
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      const renderedPages = new Set();
      const renderingPages = new Set();
      const queuedPages = new Set();
      let loadedPageCount = 0;
      let processingQueue = false;
      let pdf;
      let pageWidth;
      let pageHeight;

      pdfjsLib.GlobalWorkerOptions.workerSrc = new URL(
        "./vendor/pdfjs/pdf.worker.min.mjs",
        import.meta.url
      ).href;

      function updateStatus() {
        status.textContent = `已加载 ${loadedPageCount} / ${pdf.numPages} 页`;
      }

      async function renderPage(number) {
        if (renderedPages.has(number) || renderingPages.has(number)) return;
        renderingPages.add(number);
        const pageElement = pages.children[number - 1];

        try {
          const page = await pdf.getPage(number);
          const availableWidth = Math.min(pages.clientWidth, 1440);
          const viewport = page.getViewport({ scale: availableWidth / pageWidth });
          const pixelRatio = window.devicePixelRatio || 1;
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d", { alpha: false });

          canvas.width = Math.floor(viewport.width * pixelRatio);
          canvas.height = Math.floor(viewport.height * pixelRatio);
          await page.render({
            canvasContext: context,
            transform: [pixelRatio, 0, 0, pixelRatio, 0, 0],
            viewport,
          }).promise;

          pageElement.replaceChildren(canvas);
          pageElement.removeAttribute("aria-busy");
          renderedPages.add(number);
          loadedPageCount += 1;
          updateStatus();
        } catch (exception) {
          pageElement.textContent = `第 ${number} 页加载失败`;
          console.error(`Unable to render portfolio page ${number}`, exception);
        } finally {
          renderingPages.delete(number);
        }
      }

      async function processRenderQueue() {
        if (processingQueue) return;
        processingQueue = true;

        while (queuedPages.size > 0) {
          const [nextPage] = [...queuedPages].sort((first, second) => {
            const firstDistance = Math.abs(pages.children[first - 1].getBoundingClientRect().top);
            const secondDistance = Math.abs(pages.children[second - 1].getBoundingClientRect().top);
            return firstDistance - secondDistance;
          });
          queuedPages.delete(nextPage);
          await renderPage(nextPage);
        }

        processingQueue = false;
      }

      function queuePage(number) {
        if (renderedPages.has(number) || renderingPages.has(number) || queuedPages.has(number)) return;
        queuedPages.add(number);
        void processRenderQueue();
      }

      async function renderPortfolio() {
        try {
          pdf = await pdfjsLib.getDocument({
            url: pdfUrl,
            rangeChunkSize: 256 * 1024,
            disableAutoFetch: true,
            disableStream: true,
          }).promise;

          const firstPage = await pdf.getPage(1);
          const firstViewport = firstPage.getViewport({ scale: 1 });
          pageWidth = firstViewport.width;
          pageHeight = firstViewport.height;

          for (let number = 1; number <= pdf.numPages; number += 1) {
            const pageElement = document.createElement("section");
            pageElement.className = "page";
            pageElement.dataset.page = number;
            pageElement.style.aspectRatio = `${pageWidth} / ${pageHeight}`;
            pageElement.setAttribute("aria-label", `作品集第 ${number} 页`);
            pageElement.setAttribute("aria-busy", "true");
            pageElement.innerHTML = `<div class="page-placeholder">第 ${number} 页</div>`;
            pages.append(pageElement);
          }

          await renderPage(1);

          const observer = new IntersectionObserver((entries) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue;
              observer.unobserve(entry.target);
              queuePage(Number(entry.target.dataset.page));
            }
          }, { rootMargin: "200px 0px" });

          for (const pageElement of pages.children) {
            if (pageElement.dataset.page !== "1") observer.observe(pageElement);
          }
          pages.setAttribute("aria-busy", "false");
        } catch (exception) {
          console.error("Unable to load portfolio PDF", exception);
          pages.setAttribute("aria-busy", "false");
          status.textContent = "加载失败";
          error.hidden = false;
        }
      }

      renderPortfolio();
    </script>
  </body>
</html>
