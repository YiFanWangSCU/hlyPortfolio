<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="个人作品集" />
    <title>作品集</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #e5e5e5;
        color: #171717;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }

      .topbar {
        position: sticky;
        z-index: 1;
        top: 0;
        display: flex;
        min-height: 52px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px max(20px, calc((100vw - 1400px) / 2));
        background: rgb(23 23 23 / 92%);
        color: #fff;
        backdrop-filter: blur(12px);
      }

      h1 { margin: 0; font-size: 1rem; font-weight: 650; }
      #status { font-size: 0.875rem; color: #d4d4d4; }

      .pages {
        width: min(100%, 1440px);
        margin: 0 auto;
        padding: 20px;
      }

      .page {
        overflow: hidden;
        margin: 0 auto 20px;
        background: #fff;
        box-shadow: 0 3px 16px rgb(0 0 0 / 20%);
      }

      .page canvas {
        display: block;
        width: 100%;
        height: auto;
      }

      .error {
        width: min(calc(100% - 40px), 520px);
        margin: 64px auto;
        padding: 32px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 3px 16px rgb(0 0 0 / 12%);
        text-align: center;
      }

      .error[hidden] { display: none; }
      .error h2 { margin: 0 0 10px; font-size: 1.25rem; }
      .error p { margin: 0; color: #525252; line-height: 1.7; }
      .error a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 15px;
        border-radius: 8px;
        background: #171717;
        color: #fff;
        text-decoration: none;
      }

      @media (max-width: 640px) {
        .topbar { min-height: 48px; padding: 10px 14px; }
        h1 { font-size: 0.9375rem; }
        #status { font-size: 0.8125rem; }
        .pages { padding: 8px 0; }
        .page { margin-bottom: 8px; box-shadow: 0 2px 10px rgb(0 0 0 / 18%); }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>作品集</h1>
      <span id="status" aria-live="polite">正在准备作品集…</span>
    </header>
    <main id="pages" class="pages" aria-busy="true"></main>
    <section id="error" class="error" hidden>
      <h2>作品集暂时无法显示</h2>
      <p>请稍后刷新页面，或直接打开 PDF 文件。</p>
      <a href="./portfolio.pdf" target="_blank" rel="noopener">打开 PDF</a>
    </section>

    <script type="module">
      import * as pdfjsLib from "./vendor/pdfjs/pdf.min.mjs";

      const pdfUrl = "./portfolio.pdf";
      const pages = document.getElementById("pages");
      const status = document.getElementById("status");
      const error = document.getElementById("error");

      pdfjsLib.GlobalWorkerOptions.workerSrc = new URL(
        "./vendor/pdfjs/pdf.worker.min.mjs",
        import.meta.url
      ).href;

      async function renderPortfolio() {
        try {
          const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
          const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

          for (let number = 1; number <= pdf.numPages; number += 1) {
            status.textContent = `正在加载第 ${number} / ${pdf.numPages} 页`;
            const page = await pdf.getPage(number);
            const originalViewport = page.getViewport({ scale: 1 });
            const availableWidth = Math.min(pages.clientWidth, 1440);
            const viewport = page.getViewport({ scale: availableWidth / originalViewport.width });
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d", { alpha: false });

            canvas.width = Math.floor(viewport.width * pixelRatio);
            canvas.height = Math.floor(viewport.height * pixelRatio);
            const pageElement = document.createElement("section");
            pageElement.className = "page";
            pageElement.setAttribute("aria-label", `作品集第 ${number} 页`);
            pageElement.append(canvas);
            pages.append(pageElement);

            await page.render({
              canvasContext: context,
              transform: [pixelRatio, 0, 0, pixelRatio, 0, 0],
              viewport,
            }).promise;
          }

          pages.setAttribute("aria-busy", "false");
          status.textContent = `共 ${pdf.numPages} 页`;
        } catch (exception) {
          console.error("Unable to render portfolio PDF", exception);
          pages.setAttribute("aria-busy", "false");
          status.textContent = "加载失败";
          error.hidden = false;
        }
      }

      renderPortfolio();
    </script>
  </body>
</html>
