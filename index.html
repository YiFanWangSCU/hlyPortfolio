<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="个人作品集" />
    <title>作品集</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #f5f5f4;
        color: #171717;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
      }

      .viewer {
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border: 0;
        background: #525252;
      }

      .notice {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 480px);
        padding: 36px;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 40px rgb(0 0 0 / 8%);
        text-align: center;
      }

      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { margin: 0; color: #525252; line-height: 1.7; }
      a {
        display: inline-block;
        margin-top: 22px;
        padding: 10px 16px;
        border-radius: 8px;
        background: #171717;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main id="loading" class="notice">
      <section class="card">
        <h1>作品集正在加载</h1>
        <p>请稍候…</p>
      </section>
    </main>

    <script>
      const pdfUrl = "./portfolio.pdf";
      const loading = document.getElementById("loading");

      async function showPortfolio() {
        try {
          const response = await fetch(pdfUrl, { method: "HEAD", cache: "no-store" });
          if (!response.ok) throw new Error("PDF not found");

          const viewer = document.createElement("iframe");
          viewer.className = "viewer";
          viewer.title = "作品集 PDF";
          viewer.src = `${pdfUrl}#view=FitH`;
          loading.replaceWith(viewer);
        } catch (_) {
          loading.innerHTML = `
            <section class="card">
              <h1>作品集准备中</h1>
              <p>内容即将更新，欢迎稍后再来。</p>
              <a href="${pdfUrl}" target="_blank" rel="noopener">尝试打开 PDF</a>
            </section>`;
        }
      }

      showPortfolio();
    </script>
  </body>
</html>
